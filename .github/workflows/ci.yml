name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  conformance:
    name: Conformance run against ${{ matrix.target.name }}
    needs: checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: reference server
            cmd: node dist/src/reference/server.js
          - name: server-everything 2.0.1
            cmd: node node_modules/@modelcontextprotocol/server-everything/dist/index.js stdio
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: mcp-conform
        run: node dist/src/conformance/cli.js --call echo --args '{"message":"hello"}' --timeout 10000 --json report.json -- ${{ matrix.target.cmd }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: conformance-${{ strategy.job-index }}
          path: report.json
